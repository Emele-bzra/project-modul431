                    <li class="nav-item dropdown-parent">

                            <img id="accessibility-icon" src="/slarachare_games/images/accessability_white_icon.png" alt="accesability_bild" width="35">
                        </a>
                    </li>
                  <script>
    document.addEventListener('DOMContentLoaded', function () {
        const toggle = document.getElementById('accessibility-toggle');
        const icon = document.getElementById('accessibility-icon');

        const iconWhite = "../slarachare_games/images/accessability_white_icon.png";
        const iconBlack = "../slarachare_games/images/accesability schwarz.png";

        // Prüfe beim Laden, ob Modus gespeichert ist
        if (localStorage.getItem('bw-accessibility') === 'on') {
            document.body.classList.add('bw-accessibility');
            icon.src = iconBlack;
        } else {
            icon.src = iconWhite;
        }

        toggle.addEventListener('click', function (e) {
            e.preventDefault();
            document.body.classList.toggle('bw-accessibility');

            if (document.body.classList.contains('bw-accessibility')) {
                icon.src = iconBlack;
                localStorage.setItem('bw-accessibility', 'on');
            } else {
                icon.src = iconWhite;
                localStorage.setItem('bw-accessibility', 'off');
            }
        });
    });
</script>

 <h3>Kontakt</h3>
 <br>
 
  <p>
    Wenn du Fragen oder Anliegen hast, zögere nicht, uns zu kontaktieren!
<br>
<br>
<ul style="display: flex; flex-direction: row; gap: 20px; list-style: none; padding: 0; justify-content: flex-start;">
    <li>
        <a class="link" href="mailto:contact.slaracharegames@gmail.com">
            <img  class="icon-hover" id="gmail-icon" src="/slarachare_games/images/mailicon_white.png" alt="email_logo" width="40">
        </a>
    </li>
    <li>
        <a class="link" href="https://github.com/SkarabaeusGames">
            <img class="icon-hover" id="github-icon" src="/slarachare_games/images/githubicon_white.png" alt="github_icon" width="30">
        </a>
    </li>
    <li>
        <a class="link" href="https://www.tiktok.com/@slarachare.games?_t=ZN-8xFKcRHpa7y&_r=1">
            <img class="icon-hover" id="tiktok-icon" src="/slarachare_games/images/tiktokicon_white.png" alt="tiktok_icon" width="30">
        </a>
    </li>
    <li>
        <a class="link" href="https://www.youtube.com/@slaracharegames">
            <img class="icon-hover" id="youtube-icon" src="/slarachare_games/images/youtubeicon_white.png" alt="youtube_icon" width="40">
        </a>
    </li>
</ul>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const youtubeIcon = document.getElementById('youtube-icon');
        const tiktokIcon = document.getElementById('tiktok-icon');
        const githubIcon = document.getElementById('github-icon');
        const gmailIcon = document.getElementById('gmail-icon');

        const youtubeWhite = "/slarachare_games/images/youtubeicon_white.png";
        const youtubeBlack = "/slarachare_games/images/youtube black.png";
        const tiktokWhite = "/slarachare_games/images/tiktokicon_white.png";
        const tiktokBlack = "/slarachare_games/images/tiktok black.png";
        const githubWhite = "/slarachare_games/images/githubicon_white.png";
        const githubBlack = "/slarachare_games/images/github black.png";
        const gmailWhite = "/slarachare_games/images/mailicon_white.png";
        const gmailBlack = "/slarachare_games/images/gmail black.png";

        function setIconSizes(isBW) {
            if (isBW) {
                youtubeIcon.width = 50;
                tiktokIcon.width = 30;
                githubIcon.width = 50;
                gmailIcon.width = 60;
                gmailIcon.classList.add('gmail-black');
                tiktokIcon.classList.add('tiktok-black');
            } else {
                youtubeIcon.width = 40;
                tiktokIcon.width = 30;
                githubIcon.width = 30;
                gmailIcon.width = 40;
                gmailIcon.classList.remove('gmail-black');
                tiktokIcon.classList.remove('tiktok-black');
            }
        }

        function updateIcons() {
            if (document.body.classList.contains('bw-accessibility')) {
                youtubeIcon.src = youtubeBlack;
                tiktokIcon.src = tiktokBlack;
                githubIcon.src = githubBlack;
                gmailIcon.src = gmailBlack;
                setIconSizes(true);
            } else {
                youtubeIcon.src = youtubeWhite;
                tiktokIcon.src = tiktokWhite;
                githubIcon.src = githubWhite;
                gmailIcon.src = gmailWhite;
                setIconSizes(false);
            }
        }

        // Initial check
        updateIcons();

        // Listen for changes to the bw-accessibility class
        const observer = new MutationObserver(updateIcons);
        observer.observe(document.body, { attributes: true, attributeFilter: ['class'] });
    });
</script>


  
</div>
</p>
