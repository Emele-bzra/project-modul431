<style>
    header, h1, h2, h3{
      font-family: 'Orbitron', sans-serif;

</style>
</head>
<body>

    <!-- Obere grüne Linie -->
    <div class="green-bar"></div>

    <!-- Header -->
    <header class="site-header">
        <div class="header-container">
            <div class="header-logo">
                <a href="../slarachare_games/index.html">
                    <img src="./images/Download.png" alt="Slarachare Games Logo" >
                </a>
            </div>
            <div class=".site-header">
            <nav class="header-nav">
                <ul class="nav-list nav-gap-50">
                    <li class="nav-item"><a href="../slarachare_games/index.html">Home</a></li>
                    <li class="nav-item dropdown-parent">
                        <a href="games.html">Games</a>
                    
                    </li>
                    <li class="nav-item dropdown-parent">
                        <a href="infos.html">Infos</a></li>
                    <li class="nav-item dropdown-parent">
                        <a href="about_us.html">About us</a>
                        <ul class="dropdown-menu">
                            <li><a href="team.html">Team</a></li>
                        </ul>
                    </li>
                    <li class="nav-item dropdown-parent">
                        <a href="support.html"><span style="text-decoration: underline;">Support</span></a>
                        <ul class="dropdown-menu">
                            <li><a href="mailto:contact.slaracharegames@gmail.com">Feedback</a></li>
                            <li><a href="help.html">Contact</a></li>
                        </ul>
                    </li>
                    <li class="nav-item dropdown-parent">
                        <a href="#" id="accessibility-toggle">
                            <img id="accessibility-icon" src="../slarachare_games/images/Bild.png" alt="accesability_bild" width="35">
                        </a>
                    </li>
                    <script>
                        document.addEventListener('DOMContentLoaded', function () {
                            const toggle = document.getElementById('accessibility-toggle');
                            const icon = document.getElementById('accessibility-icon');
                            // Prüfe beim Laden, ob Modus gespeichert ist
                            if (localStorage.getItem('bw-accessibility') === 'on') {
                                document.body.classList.add('bw-accessibility');
                                icon.src = "../slarachare_games/images/accesability schwarz.png";
                            }
                            toggle.addEventListener('click', function (e) {
                                e.preventDefault();
                                document.body.classList.toggle('bw-accessibility');
                                if (document.body.classList.contains('bw-accessibility')) {
                                    icon.src = "../slarachare_games/images/accesability schwarz.png";
                                    localStorage.setItem('bw-accessibility', 'on');
                                } else {
                                    icon.src = "../slarachare_games/images/Bild.png";
                                    localStorage.setItem('bw-accessibility', 'off');
                                }
                            });
                        });
                    </script>
               
                </ul>
            </nav>
            </div>
        </div>
    </header>

    <!-- Untere grüne Linie -->
    <div class="green-bar"></div>

    <!-- Hauptinhalt -->

    <li><a class="link" href="https://www.youtube.com/@slaracharegames"><img src="/slarachare_games/images/youtubeicon_white.png" alt="youtube_icon" width="40"></a></li>

</div>

<script>
    window.addEventListener('scroll', function () {
        const header = document.querySelector('.site-header');
        if (window.scrollY > 10) {
            header.classList.add('sticky');
        } else {
            header.classList.remove('sticky');
        }
    });
</script>
